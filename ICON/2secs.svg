<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --t: 2s; }
    .peek  { animation: pop var(--t) infinite; }
    .tilt  { animation: tilt var(--t) infinite ease-in-out; transform-origin: 335px 330px; }
    .look  { animation: look var(--t) infinite ease-in-out; }
    .blink { animation: blink var(--t) infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .earL  { animation: earL var(--t) infinite; transform-box: fill-box; transform-origin: 100% 80%; }
    .earR  { animation: earR var(--t) infinite; transform-box: fill-box; transform-origin: 0% 80%; }

    /* pop up with overshoot, hold, drop back down */
    @keyframes pop {
      0%   { transform: translateY(290px); animation-timing-function: cubic-bezier(.2,.9,.3,1.2); }
      30%  { transform: translateY(-14px); animation-timing-function: ease-in-out; }
      42%, 78% { transform: translateY(0); animation-timing-function: cubic-bezier(.6,0,.9,.5); }
      100% { transform: translateY(290px); }
    }
    /* head tilt: left, right, center */
    @keyframes tilt {
      0%, 40% { transform: rotate(0); }
      50% { transform: rotate(-9deg); }
      62% { transform: rotate(9deg); }
      72%, 100% { transform: rotate(0); }
    }
    @keyframes look {
      0%, 40% { transform: translateX(0); }
      50% { transform: translateX(-5px); }
      62% { transform: translateX(5px); }
      72%, 100% { transform: translateX(0); }
    }
    @keyframes blink {
      0%, 55%, 63%, 100% { transform: scaleY(1); }
      59% { transform: scaleY(.08); }
    }
    @keyframes earL {
      0%, 40%, 75%, 100% { transform: rotate(0); }
      52%, 66% { transform: rotate(-16deg); }
      58% { transform: rotate(5deg); }
    }
    @keyframes earR {
      0%, 40%, 75%, 100% { transform: rotate(0); }
      52%, 66% { transform: rotate(16deg); }
      58% { transform: rotate(-5deg); }
    }
    .gun   { animation: recoil var(--t) infinite; }
    .flash { animation: flash var(--t) infinite; transform-box: fill-box; transform-origin: 100% 50%; opacity: 0; }
    @keyframes recoil {
      0%, 56% { transform: translateX(0); }
      60% { transform: translateX(9px); }
      72%, 100% { transform: translateX(0); }
    }
    @keyframes flash {
      0%, 56% { opacity: 0; transform: scale(.4); }
      59% { opacity: 1; transform: scale(1.1); }
      64%, 100% { opacity: 0; transform: scale(.6); }
    }
    @media (prefers-reduced-motion: reduce) {
      .peek, .tilt, .look, .blink, .earL, .earR, .gun, .flash { animation: none; }
      .peek { transform: translateY(0); }
    }
  </style>
  <defs><clipPath id="sq"><circle cx="200" cy="200" r="198"/></clipPath></defs>
  <circle cx="200" cy="200" r="200" fill="#111111"/>
  <g clip-path="url(#sq)">
    <g transform="translate(-45 0)"><g class="peek"><g class="tilt">
      <g transform="translate(335 235) rotate(-6) translate(-340 -215)">
        <path d="M340 130 C270 130 245 190 245 260 L240 460 L440 460 L435 260 C435 190 410 130 340 130 Z" fill="#ffffff"/>
        <path d="M180 500 C190 350 260 320 340 320 C420 320 490 350 500 500 Z" fill="#ffffff" stroke="#111111" stroke-width="4"/>
        <path class="earL" d="M292 205 L232 185 L291 236 Z" fill="#ffffff" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
        <path class="earR" d="M388 205 L448 185 L389 236 Z" fill="#ffffff" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
        <ellipse cx="340" cy="215" rx="52" ry="62" fill="#ffffff" stroke="#111111" stroke-width="4"/>
        <path d="M290 190 C315 200 338 185 340 162 M390 190 C365 200 342 185 340 162" stroke="#111111" stroke-width="4" stroke-linecap="round" fill="none"/>
        <g class="look"><g class="blink">
          <ellipse cx="318" cy="224" rx="9" ry="11" fill="#111111"/>
          <circle cx="315" cy="226" r="5" fill="#ffffff"/>
          <ellipse cx="362" cy="224" rx="9" ry="11" fill="#111111"/>
          <circle cx="359" cy="226" r="5" fill="#ffffff"/>
        </g></g>
      </g>
    </g>
      <g transform="translate(0 -34)"><g class="gun">
        <path d="M425 385 L352 356" stroke="#111111" stroke-width="30" stroke-linecap="round" fill="none"/>
        <path d="M425 385 L352 356" stroke="#ffffff" stroke-width="22" stroke-linecap="round" fill="none"/>
        <path d="M330 353 L354 353 L361 388 L338 388 Z" fill="#7a8094" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
        <rect x="252" y="332" width="102" height="22" rx="5" fill="#9aa0b4" stroke="#111111" stroke-width="4"/>
        <rect x="248" y="338" width="10" height="10" rx="2" fill="#5d6378" stroke="#111111" stroke-width="3"/>
        <circle cx="348" cy="360" r="13" fill="#ffffff" stroke="#111111" stroke-width="4"/>
        <polygon class="flash" points="246,343 222,330 232,343 218,343 232,350 224,362 244,350" fill="#ffd23f" stroke="#ff8a00" stroke-width="2"/>
      </g></g>
    </g></g>
  </g>
</svg>
